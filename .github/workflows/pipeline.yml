name: Docker tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mts-labwork-2:latest .

      - name: Run tests
        id: tests
        env:
          PLAYGROUND_USERNAME: ${{ secrets.PLAYGROUND_USERNAME }}
          PLAYGROUND_PASSWORD: ${{ secrets.PLAYGROUND_PASSWORD }}
        run: |
          : "${PLAYGROUND_USERNAME:?Set the PLAYGROUND_USERNAME repository secret}"
          : "${PLAYGROUND_PASSWORD:?Set the PLAYGROUND_PASSWORD repository secret}"
          mkdir -p target
          docker run --rm --volume "$PWD/target:/app/target" \
            --env PLAYGROUND_USERNAME --env PLAYGROUND_PASSWORD mts-labwork-2:latest

      - name: Set up Java for Allure
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js for Allure CLI
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Allure report
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          test -d target/allure-results
          npx --yes allure-commandline@2.29.0 generate target/allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
